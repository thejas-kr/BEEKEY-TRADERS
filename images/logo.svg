<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <defs>
    <!-- Gradient for Badge -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1728" />
      <stop offset="60%" stop-color="#0f2137" />
      <stop offset="100%" stop-color="#162f4d" />
    </linearGradient>
    <!-- Gold Gradient for Accents -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Logo Mark Container -->
  <g transform="translate(4, 4)">
    <!-- Badge Background -->
    <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#badgeGrad)" filter="url(#shadow)" />
    <!-- Outer Gold Border Accent -->
    <rect x="1.5" y="1.5" width="53" height="53" rx="12.5" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.8" />
    
    <!-- Stylized Monogram BT -->
    <text x="28" y="38" 
          font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" 
          font-size="26" 
          font-weight="900" 
          fill="url(#goldGrad)" 
          text-anchor="middle" 
          letter-spacing="-1">BT</text>
  </g>

  <!-- Typography Group -->
  <g transform="translate(74, 8)">
    <!-- Main Brand Name -->
    <text x="0" y="28" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="24" 
          font-weight="900" 
          letter-spacing="-0.5" 
          fill="#0f2137">BEEKEY TRADERS</text>

    <!-- Subtitle / Tagline -->
    <text x="1" y="44" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="9.5" 
          font-weight="700" 
          letter-spacing="2" 
          text-transform="uppercase" 
          fill="#d97706">WHOLESALE FOOTWEAR</text>

    <!-- Small Accent Dot -->
    <circle cx="168" cy="41" r="2.5" fill="#0f2137" opacity="0.4" />
    
    <!-- Secondary Tagline -->
    <text x="176" y="44" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="9.5" 
          font-weight="600" 
          letter-spacing="1" 
          fill="#64748b">KARNATAKA</text>
  </g>
</svg>
