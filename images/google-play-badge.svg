<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 162 48" width="162" height="48">
  <!-- Badge Background -->
  <rect x="0.5" y="0.5" width="161" height="47" rx="7" fill="#000000" stroke="#a6a6a6" stroke-width="0.8" />
  
  <!-- Google Play Icon -->
  <g transform="translate(13, 8.5)">
    <!-- Blue Triangle -->
    <path d="M1.2 1.4C1 1.7 0.9 2.1 0.9 2.6v25.8c0 0.5 0.1 0.9 0.3 1.2L15.3 15.5 1.2 1.4z" fill="#00e5ff" />
    <!-- Light Blue Gradient Overlay -->
    <path d="M1.2 1.4C1 1.7 0.9 2.1 0.9 2.6v25.8c0 0.5 0.1 0.9 0.3 1.2L15.3 15.5 1.2 1.4z" fill="url(#playBlue)" />
    <!-- Green Polygon -->
    <path d="M20.1 10.7l-4.8 4.8 4.8 4.8 5.7-3.2c1.6-0.9 1.6-2.4 0-3.3l-5.7-3.1z" fill="#ffca28" />
    <!-- Red Polygon -->
    <path d="M1.2 30l14.1-14.5 4.8 4.8-13.8 7.8c-1.8 1-3.6 0.9-5.1 1.9z" fill="#ff3a44" />
    <!-- Yellow / Top Polygon -->
    <path d="M1.2 1C2.6 1.9 4.5 1.9 6.3 2.9l13.8 7.8-4.8 4.8L1.2 1z" fill="#00e676" />
  </g>

  <!-- Gradients for Play Store Icon -->
  <defs>
    <linearGradient id="playBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0086ff" />
      <stop offset="100%" stop-color="#00f3ff" />
    </linearGradient>
  </defs>

  <!-- Text "GET IT ON" -->
  <text x="46" y="16" fill="#cccccc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.8">GET IT ON</text>

  <!-- Text "Google Play" -->
  <text x="45" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" letter-spacing="-0.2">Google Play</text>
</svg>
